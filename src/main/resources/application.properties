spring.application.name=sistema-login
server.port=${PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sistema_login}
spring.data.mongodb.database=${MONGODB_DATABASE:sistema_login}
spring.session.store-type=mongodb
spring.session.mongodb.collection-name=sessoes
spring.session.timeout=30m

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# em producao, defina COOKIE_SECURE=true atras de https
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

logging.level.org.springframework.security=INFO
